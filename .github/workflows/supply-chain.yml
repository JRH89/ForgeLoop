name: Supply-chain evidence
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  scan-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan source, lockfiles, configuration, and committed secrets
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build release images
        run: |
          docker build -t "forgeloop/control-plane:${GITHUB_SHA}" control-plane
          docker build -t "forgeloop/runner:${GITHUB_SHA}" runner
          docker build -t "forgeloop/web:${GITHUB_SHA}" frontend
      - name: Scan control-plane image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: "forgeloop/control-plane:${{ github.sha }}"
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
      - name: Scan runner image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: "forgeloop/runner:${{ github.sha }}"
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
      - name: Scan web image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: "forgeloop/web:${{ github.sha }}"
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
      - name: Generate repository SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: forgeloop.spdx.json
          upload-artifact: false
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "forgeloop-sbom-${{ github.sha }}"
          path: forgeloop.spdx.json
          retention-days: 90
