name: Supply-chain evidence
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  scan-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            control-plane/pom.xml
            runner/pom.xml
            harness/pom.xml
      # Trivy resolves Maven parent/BOM metadata during a filesystem scan. Populate the
      # cache first so shared Maven Central CI IP limits cannot create a false security failure.
      - name: Resolve Java dependency metadata
        run: |
          mvn -B -q -f control-plane/pom.xml dependency:go-offline
          mvn -B -q -f runner/pom.xml dependency:go-offline
          mvn -B -q -f harness/pom.xml dependency:go-offline
      - name: Scan source, lockfiles, configuration, and committed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          version: v0.74.0
      - name: Build release images
        run: |
          docker build -t "forgeloop/control-plane:${GITHUB_SHA}" control-plane
          docker build -t "forgeloop/runner:${GITHUB_SHA}" runner
          docker build -f deploy/web.Dockerfile -t "forgeloop/web:${GITHUB_SHA}" .
      - name: Scan control-plane image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "forgeloop/control-plane:${{ github.sha }}"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          skip-setup-trivy: true
      - name: Scan runner image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "forgeloop/runner:${{ github.sha }}"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          skip-setup-trivy: true
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "forgeloop/web:${{ github.sha }}"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          skip-setup-trivy: true
      - name: Generate repository SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: forgeloop.spdx.json
          upload-artifact: false
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "forgeloop-sbom-${{ github.sha }}"
          path: forgeloop.spdx.json
          retention-days: 90
