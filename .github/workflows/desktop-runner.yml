name: Desktop runner packages
on:
  pull_request:
    paths: ['runner/**', 'scripts/Build-DesktopRunner.ps1', '.github/workflows/desktop-runner.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, type: msi}
          - {os: macos-latest, type: dmg}
          - {os: ubuntu-latest, type: deb}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Test runner and desktop logic
        run: mvn -B verify
        working-directory: runner
      - name: Build bundled-runtime image
        shell: pwsh
        run: ./scripts/Build-DesktopRunner.ps1 -PackageType app-image
      - name: Smoke test packaged runtime without enrolling or spending credits
        shell: pwsh
        run: |
          $root = 'artifacts/desktop-runner/packages/ForgeLoop Runner'
          if ($IsWindows) { $java = "$root/runtime/bin/java.exe"; $jar = "$root/app/runner.jar" }
          elseif ($IsMacOS) { $java = "$root.app/Contents/runtime/Contents/Home/bin/java"; $jar = "$root.app/Contents/app/runner.jar" }
          else { $java = "$root/lib/runtime/bin/java"; $jar = "$root/lib/app/runner.jar" }
          & $java -cp $jar io.forgeloop.runner.DesktopRunner --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime failed' }
      - name: Build unsigned native development installer
        shell: pwsh
        run: ./scripts/Build-DesktopRunner.ps1 -PackageType '${{ matrix.type }}' -OutputDirectory artifacts/native-installer
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-runner-${{ matrix.os }}-unsigned
          path: artifacts/native-installer/packages/*
