name: Desktop runner packages
on:
  pull_request:
    paths: ['runner/**', 'scripts/Build-DesktopRunner.ps1', 'scripts/Build-ArchPackage.sh', 'scripts/Test-DesktopPackage.ps1', 'scripts/Test-ArchPackage.sh', 'scripts/Test-DesktopUpgrade.ps1', 'scripts/Prepare-DesktopRelease.ps1', '.github/workflows/desktop-runner.yml', '.github/workflows/release-desktop.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        type: string
        default: '1.0.6'
permissions: {contents: read}
jobs:
  package:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, type: msi, platform: windows, architecture: x64}
          - {os: windows-11-arm, type: msi, platform: windows, architecture: arm64}
          - {os: macos-15, type: dmg, platform: macos, architecture: arm64}
          - {os: macos-15-intel, type: dmg, platform: macos, architecture: x64}
          - {os: ubuntu-22.04, type: deb, platform: linux, architecture: x64}
          - {os: ubuntu-22.04, type: rpm, platform: linux, architecture: x64}
          - {os: ubuntu-22.04, type: tar.gz, platform: linux, architecture: x64}
          - {os: ubuntu-22.04, type: pkg.tar.zst, platform: linux, architecture: x64}
          - {os: ubuntu-24.04-arm, type: deb, platform: linux, architecture: arm64}
          - {os: ubuntu-24.04-arm, type: rpm, platform: linux, architecture: arm64}
          - {os: ubuntu-24.04-arm, type: tar.gz, platform: linux, architecture: arm64}
          - {os: ubuntu-24.04-arm, type: pkg.tar.zst, platform: linux, architecture: arm64}
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE_VERSION: ${{ inputs.package-version || '1.0.6' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Enable x64 Arch package tools on the ARM64 host
        if: matrix.platform == 'linux' && matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64
      - name: Test runner and desktop logic
        if: runner.os != 'Linux'
        run: mvn -B verify
        working-directory: runner
      - name: Install Linux desktop keyring test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot file libsecret-tools gnome-keyring xvfb rpm xdg-utils zstd
      - name: Test Linux native key storage in an isolated session
        if: runner.os == 'Linux'
        env: {FORGELOOP_TEST_KEYRING: 'true'}
        shell: bash
        working-directory: runner
        run: |
          xvfb-run -a dbus-run-session -- bash -c 'printf "ci-only-unlock" | gnome-keyring-daemon --unlock --components=secrets; mvn -B verify'
      - name: Build bundled-runtime image
        shell: pwsh
        run: ./scripts/Build-DesktopRunner.ps1 -PackageType app-image -PackageVersion $env:PACKAGE_VERSION
      - name: Smoke test packaged runtime without enrolling or spending credits
        shell: pwsh
        run: |
          $root = 'artifacts/desktop-runner/packages/ForgeLoop Runner'
          if ($IsWindows) { $launcher = "$root/ForgeLoop Runner.exe" }
          elseif ($IsMacOS) { $launcher = "$root.app/Contents/MacOS/ForgeLoop Runner" }
          else { $launcher = "$root/bin/ForgeLoop Runner" }
          if (-not (Test-Path -LiteralPath $launcher)) { throw "Packaged launcher missing: $launcher" }
          if ($IsWindows) {
            # Windows jpackage launchers are GUI processes, so their stdout is not capturable.
            # Validate both launcher metadata and its generated JVM option, then launch it.
            $configuration = "$root/app/ForgeLoop Runner.cfg"
            if ((Get-Item -LiteralPath $launcher).VersionInfo.ProductVersion -ne $env:PACKAGE_VERSION) { throw 'Packaged Windows executable version mismatch' }
            $process = Start-Process -FilePath $launcher -ArgumentList '--version' -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw 'Packaged Windows launcher failed' }
          }
          else {
            # Exercise jpackage's launcher so this verifies its embedded version option too.
            if ($IsMacOS) { $configuration = "$root.app/Contents/app/ForgeLoop Runner.cfg" }
            else { $configuration = "$root/lib/app/ForgeLoop Runner.cfg" }
            $actualVersion = & $launcher --version
            if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime failed' }
            if ($actualVersion.Trim() -ne $env:PACKAGE_VERSION) { throw "Packaged version mismatch: $actualVersion" }
          }
          if (-not (Test-Path -LiteralPath $configuration)) { throw 'Packaged launcher configuration missing' }
          $configText = Get-Content -LiteralPath $configuration -Raw
          if (-not $configText.Contains("-Dforgeloop.desktop.version=$env:PACKAGE_VERSION")) { throw 'Packaged launcher version option missing' }
      - name: Install pinned WiX tools for Windows ARM64 packaging
        if: matrix.platform == 'windows' && matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          # The Windows ARM runner image omits WiX; use the official portable v3.14.1 archive.
          $archive = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $archive
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31') { throw 'WiX Toolset checksum mismatch' }
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'wix314'
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDirectory
          foreach ($tool in @('candle.exe', 'light.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $toolDirectory $tool))) { throw "WiX tool missing: $tool" }
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $toolDirectory
      - name: Build unsigned native development installer
        shell: pwsh
        run: ./scripts/Build-DesktopRunner.ps1 -PackageType '${{ matrix.type }}' -OutputDirectory artifacts/native-installer -PackageVersion $env:PACKAGE_VERSION
      - name: Verify native installer launch on disposable host
        if: runner.os != 'Linux'
        shell: pwsh
        run: ./scripts/Test-DesktopPackage.ps1 -PackageType '${{ matrix.type }}'
      - name: Verify installed Linux package and keyring integration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a dbus-run-session -- bash -c 'printf "ci-only-unlock" | gnome-keyring-daemon --unlock --components=secrets; pwsh -File scripts/Test-DesktopPackage.ps1 -PackageType ${{ matrix.type }}'
      - name: Install and verify native Arch package
        if: matrix.platform == 'linux' && matrix.type == 'pkg.tar.zst'
        shell: bash
        run: bash scripts/Test-ArchPackage.sh artifacts/native-installer/packages/forgeloop-runner-${PACKAGE_VERSION}-linux-${{ matrix.architecture }}.pkg.tar.zst ${{ matrix.architecture }}
      - name: Build previous installer revision for upgrade regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Build-DesktopRunner.ps1 -PackageType msi -PackageVersion 1.0.0 -OutputDirectory artifacts/desktop-baseline
      - name: Verify Windows upgrade and uninstall preserve private state
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-DesktopUpgrade.ps1 -ExpectedVersion $env:PACKAGE_VERSION
      - name: Prepare named installer and checksum
        shell: pwsh
        run: ./scripts/Prepare-DesktopRelease.ps1 -Version $env:PACKAGE_VERSION -Platform '${{ matrix.platform }}' -Architecture '${{ matrix.architecture }}' -PackageType '${{ matrix.type }}'
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-release-${{ matrix.platform }}-${{ matrix.architecture }}-${{ matrix.type }}
          path: artifacts/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-setup-screenshot-${{ matrix.platform }}-${{ matrix.architecture }}-${{ matrix.type }}
          path: runner/target/desktop-*.png
