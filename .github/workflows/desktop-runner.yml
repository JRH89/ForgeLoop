name: Desktop runner packages
on:
  pull_request:
    paths: ['runner/**', 'scripts/Build-DesktopRunner.ps1', 'scripts/Test-DesktopPackage.ps1', 'scripts/Test-DesktopUpgrade.ps1', 'scripts/Prepare-DesktopRelease.ps1', '.github/workflows/desktop-runner.yml', '.github/workflows/release-desktop.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        type: string
        default: '1.0.4'
permissions: {contents: read}
jobs:
  package:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, type: msi, platform: windows, architecture: x64}
          - {os: macos-15, type: dmg, platform: macos, architecture: arm64}
          - {os: macos-15-intel, type: dmg, platform: macos, architecture: x64}
          - {os: ubuntu-latest, type: deb, platform: linux, architecture: x64}
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE_VERSION: ${{ inputs.package-version || '1.0.4' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Test runner and desktop logic
        if: runner.os != 'Linux'
        run: mvn -B verify
        working-directory: runner
      - name: Install Linux desktop keyring test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring xvfb
      - name: Test Linux native key storage in an isolated session
        if: runner.os == 'Linux'
        env: {FORGELOOP_TEST_KEYRING: 'true'}
        shell: bash
        working-directory: runner
        run: |
          xvfb-run -a dbus-run-session -- bash -c 'printf "ci-only-unlock" | gnome-keyring-daemon --unlock --components=secrets; mvn -B verify'
      - name: Build bundled-runtime image
        shell: pwsh
        run: ./scripts/Build-DesktopRunner.ps1 -PackageType app-image -PackageVersion $env:PACKAGE_VERSION
      - name: Smoke test packaged runtime without enrolling or spending credits
        shell: pwsh
        run: |
          $root = 'artifacts/desktop-runner/packages/ForgeLoop Runner'
          if ($IsWindows) { $java = "$root/runtime/bin/java.exe"; $jar = "$root/app/runner.jar" }
          elseif ($IsMacOS) { $java = "$root.app/Contents/runtime/Contents/Home/bin/java"; $jar = "$root.app/Contents/app/runner.jar" }
          else { $java = "$root/lib/runtime/bin/java"; $jar = "$root/lib/app/runner.jar" }
          & $java -cp $jar io.forgeloop.runner.DesktopRunner --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime failed' }
      - name: Build unsigned native development installer
        shell: pwsh
        run: ./scripts/Build-DesktopRunner.ps1 -PackageType '${{ matrix.type }}' -OutputDirectory artifacts/native-installer -PackageVersion $env:PACKAGE_VERSION
      - name: Verify native installer launch on disposable host
        if: runner.os != 'Linux'
        shell: pwsh
        run: ./scripts/Test-DesktopPackage.ps1 -PackageType '${{ matrix.type }}'
      - name: Verify installed Linux runtime and keyring integration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a dbus-run-session -- bash -c 'printf "ci-only-unlock" | gnome-keyring-daemon --unlock --components=secrets; pwsh -File scripts/Test-DesktopPackage.ps1 -PackageType deb'
      - name: Build previous installer revision for upgrade regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Build-DesktopRunner.ps1 -PackageType msi -PackageVersion 1.0.0 -OutputDirectory artifacts/desktop-baseline
      - name: Verify Windows upgrade and uninstall preserve private state
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-DesktopUpgrade.ps1 -ExpectedVersion $env:PACKAGE_VERSION
      - name: Prepare named installer and checksum
        shell: pwsh
        run: ./scripts/Prepare-DesktopRelease.ps1 -Version $env:PACKAGE_VERSION -Platform '${{ matrix.platform }}' -Architecture '${{ matrix.architecture }}' -PackageType '${{ matrix.type }}'
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-release-${{ matrix.platform }}-${{ matrix.architecture }}
          path: artifacts/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-setup-screenshot-${{ matrix.os }}
          path: runner/target/desktop-*.png
