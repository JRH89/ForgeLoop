name: Verify ForgeLoop
on: [push, pull_request]
permissions: { contents: read }
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git show --no-patch --format='Building ForgeLoop commit %H (%s)'
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B verify
        working-directory: control-plane
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git show --no-patch --format='Building ForgeLoop commit %H (%s)'
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git show --no-patch --format='Building ForgeLoop commit %H (%s)'
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B verify
        working-directory: harness
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git show --no-patch --format='Building ForgeLoop commit %H (%s)'
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B verify
        working-directory: runner
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git show --no-patch --format='Building ForgeLoop commit %H (%s)'
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: mcp-server/package-lock.json }
      - run: npm ci && npm run typecheck && npm test
        working-directory: mcp-server
  end-to-end:
    runs-on: ubuntu-latest
    needs: [control-plane, frontend]
    steps:
      - uses: actions/checkout@v6
      - run: git show --no-patch --format='Building ForgeLoop commit %H (%s)'
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: docker compose up --build --wait
      - run: npm ci
        working-directory: frontend
      # Browser binaries are intentionally not committed; provision the pinned Playwright Chromium in CI.
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
