services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: forgeloop
      POSTGRES_USER: forgeloop
      POSTGRES_PASSWORD: forgeloop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeloop -d forgeloop"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]
  control-plane:
    build: ./control-plane
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/forgeloop
      SPRING_DATASOURCE_USERNAME: forgeloop
      SPRING_DATASOURCE_PASSWORD: forgeloop
      # Flyway owns schema changes; Hibernate only verifies the migrated schema.
      SPRING_JPA_DDL_AUTO: validate
      FORGELOOP_SECURITY_MODE: development
      FORGELOOP_DEVELOPMENT_ORGANIZATION_ID: ${FORGELOOP_DEVELOPMENT_ORGANIZATION_ID:-local-development}
      FORGELOOP_GITHUB_APP_SLUG: ${FORGELOOP_GITHUB_APP_SLUG:-}
      FORGELOOP_GITHUB_APP_ID: ${FORGELOOP_GITHUB_APP_ID:-}
      FORGELOOP_GITHUB_PRIVATE_KEY: ${FORGELOOP_GITHUB_PRIVATE_KEY:-}
      FORGELOOP_GITHUB_WEBHOOK_SECRET: ${FORGELOOP_GITHUB_WEBHOOK_SECRET:-}
      FORGELOOP_GITHUB_INSTALLATION_STATE_SECRET: ${FORGELOOP_GITHUB_INSTALLATION_STATE_SECRET:-}
      FORGELOOP_GITHUB_DEFAULT_ISSUE_LABEL: ${FORGELOOP_GITHUB_DEFAULT_ISSUE_LABEL:-forgeloop}
      FORGELOOP_GITHUB_DEFAULT_ORGANIZATION_ID: ${FORGELOOP_GITHUB_DEFAULT_ORGANIZATION_ID:-local-development}
      FORGELOOP_GITHUB_DEFAULT_HARNESS_PROFILE: ${FORGELOOP_GITHUB_DEFAULT_HARNESS_PROFILE:-GENERIC}
      FORGELOOP_GITHUB_DEFAULT_REQUIRED_GATES: ${FORGELOOP_GITHUB_DEFAULT_REQUIRED_GATES:-unit}
      FORGELOOP_GITHUB_DEFAULT_MAX_BUDGET_USD: ${FORGELOOP_GITHUB_DEFAULT_MAX_BUDGET_USD:-25}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports: ["8090:8090"]
  web:
    build: ./frontend
    depends_on:
      control-plane: { condition: service_healthy }
    ports: ["5173:80"]
  webhook-edge:
    image: nginx:1.29-alpine
    volumes:
      - ./deploy/cloudflared/webhook-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      control-plane: { condition: service_healthy }
    # Loopback-only: cloudflared reaches this port, while GraphQL remains unexposed.
    ports: ["127.0.0.1:8091:8080"]
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    profiles: ["tunnel"]
    command: tunnel --config /etc/cloudflared/config.yml run
    restart: unless-stopped
    volumes:
      - ./deploy/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - type: bind
        source: ${CLOUDFLARED_CREDENTIALS_FILE}
        target: /etc/cloudflared/credentials.json
        read_only: true
    depends_on:
      control-plane: { condition: service_healthy }
      webhook-edge: { condition: service_started }
