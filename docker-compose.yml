services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # PostgreSQL 18 stores versioned data beneath /var/lib/postgresql.
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: forgeloop
      POSTGRES_USER: forgeloop
      POSTGRES_PASSWORD: forgeloop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeloop -d forgeloop"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]
  control-plane:
    build: ./control-plane
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/forgeloop
      SPRING_DATASOURCE_USERNAME: forgeloop
      SPRING_DATASOURCE_PASSWORD: forgeloop
      # Flyway owns schema changes; Hibernate only verifies the migrated schema.
      SPRING_JPA_DDL_AUTO: validate
      FORGELOOP_SECURITY_MODE: ${FORGELOOP_SECURITY_MODE:-github}
      FORGELOOP_DEVELOPMENT_ORGANIZATION_ID: ${FORGELOOP_DEVELOPMENT_ORGANIZATION_ID:-local-development}
      FORGELOOP_GITHUB_APP_SLUG: ${FORGELOOP_GITHUB_APP_SLUG:-}
      FORGELOOP_GITHUB_APP_ID: ${FORGELOOP_GITHUB_APP_ID:-}
      FORGELOOP_GITHUB_CLIENT_ID: ${FORGELOOP_GITHUB_CLIENT_ID:-}
      FORGELOOP_GITHUB_CLIENT_SECRET: ${FORGELOOP_GITHUB_CLIENT_SECRET:-}
      FORGELOOP_GITHUB_PRIVATE_KEY: ${FORGELOOP_GITHUB_PRIVATE_KEY:-}
      FORGELOOP_GITHUB_WEBHOOK_SECRET: ${FORGELOOP_GITHUB_WEBHOOK_SECRET:-}
      FORGELOOP_GITHUB_INSTALLATION_STATE_SECRET: ${FORGELOOP_GITHUB_INSTALLATION_STATE_SECRET:-}
      FORGELOOP_GITHUB_DEFAULT_ISSUE_LABEL: ${FORGELOOP_GITHUB_DEFAULT_ISSUE_LABEL:-forgeloop}
      FORGELOOP_GITHUB_DEFAULT_ORGANIZATION_ID: ${FORGELOOP_GITHUB_DEFAULT_ORGANIZATION_ID:-local-development}
      FORGELOOP_GITHUB_DEFAULT_HARNESS_PROFILE: ${FORGELOOP_GITHUB_DEFAULT_HARNESS_PROFILE:-GENERIC}
      FORGELOOP_GITHUB_DEFAULT_REQUIRED_GATES: ${FORGELOOP_GITHUB_DEFAULT_REQUIRED_GATES:-unit}
      FORGELOOP_GITHUB_DEFAULT_MAX_BUDGET_USD: ${FORGELOOP_GITHUB_DEFAULT_MAX_BUDGET_USD:-25}
      FORGELOOP_ARTIFACT_STORAGE_URI: file:/var/lib/forgeloop/artifacts
    volumes:
      - forgeloop-artifacts:/var/lib/forgeloop/artifacts
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports: ["8090:8090"]
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      control-plane: { condition: service_healthy }
    ports: ["5173:80"]
  webhook-edge:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/cloudflared/webhook-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      control-plane: { condition: service_healthy }
    # Loopback-only: the tunnel container reaches this service over the Docker network.
    ports: ["127.0.0.1:8091:8080"]
  database-backup:
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: forgeloop
      PGPASSWORD: forgeloop
      PGDATABASE: forgeloop
      BACKUP_INTERVAL_SECONDS: "21600"
    volumes:
      - ./deploy/postgres/backup.sh:/backup.sh:ro
      - postgres-backups:/backups
      - forgeloop-artifacts:/artifacts:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /backups -name '*.complete' -mmin -420 -print -quit)\""]
      start_period: 30s
      interval: 60s
      timeout: 5s
      retries: 3
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    profiles: ["tunnel"]
    command: tunnel --config /etc/cloudflared/config.yml run
    restart: unless-stopped
    volumes:
      - ./deploy/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - type: bind
        source: ${CLOUDFLARED_CREDENTIALS_FILE}
        target: /etc/cloudflared/credentials.json
        read_only: true
    depends_on:
      control-plane: { condition: service_healthy }
      webhook-edge: { condition: service_started }
volumes:
  postgres-backups:
  postgres-data:
    name: ${FORGELOOP_POSTGRES_VOLUME:-forgeloop-postgres-data}
  forgeloop-artifacts:
