server: { port: 8090 }
spring:
  application: { name: forgeloop-control-plane }
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:forgeloop-control;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate: { ddl-auto: "${SPRING_JPA_DDL_AUTO:validate}" }
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: "0"
management:
  endpoint:
    health: { probes: { enabled: true } }
    info: { access: read-only }
    prometheus: { access: read-only }
  endpoints:
    web:
      exposure:
        include: [health, info, prometheus]
  metrics:
    tags: { application: "${spring.application.name}" }
  prometheus:
    metrics:
      export: { enabled: true }
forgeloop:
  security:
    mode: "${FORGELOOP_SECURITY_MODE:production}"
    development-organization-id: "${FORGELOOP_DEVELOPMENT_ORGANIZATION_ID:local-development}"
    oidc-audience: "${FORGELOOP_OIDC_AUDIENCE:}"
    encryption-key: "${FORGELOOP_ENCRYPTION_KEY:}"
  artifacts:
    storage-uri: "${FORGELOOP_ARTIFACT_STORAGE_URI:}"
    retention-days: "${FORGELOOP_ARTIFACT_RETENTION_DAYS:30}"
    max-bytes: "${FORGELOOP_ARTIFACT_MAX_BYTES:1048576}"
    s3-endpoint: "${FORGELOOP_ARTIFACT_S3_ENDPOINT:}"
    s3-region: "${FORGELOOP_ARTIFACT_S3_REGION:us-east-1}"
  http:
    requests-per-minute: "${FORGELOOP_HTTP_REQUESTS_PER_MINUTE:600}"
  github:
    webhook-secret: "${FORGELOOP_GITHUB_WEBHOOK_SECRET:}"
    app-slug: "${FORGELOOP_GITHUB_APP_SLUG:}"
    app-id: "${FORGELOOP_GITHUB_APP_ID:}"
    private-key: "${FORGELOOP_GITHUB_PRIVATE_KEY:}"
    installation-state-secret: "${FORGELOOP_GITHUB_INSTALLATION_STATE_SECRET:}"
    api-url: "${FORGELOOP_GITHUB_API_URL:https://api.github.com}"
    default-policy:
      organization-id: "${FORGELOOP_GITHUB_DEFAULT_ORGANIZATION_ID:local-development}"
      issue-label: "${FORGELOOP_GITHUB_DEFAULT_ISSUE_LABEL:forgeloop}"
      harness-profile: "${FORGELOOP_GITHUB_DEFAULT_HARNESS_PROFILE:GENERIC}"
      required-gates: "${FORGELOOP_GITHUB_DEFAULT_REQUIRED_GATES:unit}"
      max-budget-usd: "${FORGELOOP_GITHUB_DEFAULT_MAX_BUDGET_USD:25}"
