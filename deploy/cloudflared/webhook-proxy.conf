resolver 127.0.0.11 valid=10s ipv6=off;
upstream control-plane {
    zone control_plane 64k;
    server control-plane:8090 resolve;
}
upstream web {
    zone web 64k;
    server web:80 resolve;
}
server {
    listen 8080;
    server_name _;

    # The public tunnel exposes the GitHub integration endpoints and frontend.
    location = /api/github/webhooks {
        proxy_pass http://control-plane;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 2m;
    }

    location = /api/github/app/callback {
        proxy_pass http://control-plane;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Route everything else to frontend
    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
