server {
  listen 80;
  location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
  location ^~ /app {
    auth_request /_auth;
    error_page 401 403 =302 /oauth2/authorization/github;
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
  location = /_auth {
    internal;
    proxy_pass http://control-plane:8090/api/auth/session;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
  location /graphql { proxy_pass http://control-plane:8090/graphql; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_set_header Content-Type $content_type; }
  location /api/github/ { proxy_pass http://control-plane:8090/api/github/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  location /oauth2/ { proxy_pass http://control-plane:8090/oauth2/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  location /login/ { proxy_pass http://control-plane:8090/login/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  location = /logout { proxy_pass http://control-plane:8090/logout; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
}
