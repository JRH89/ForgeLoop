# Re-resolve Docker service addresses after backend recreation.
resolver 127.0.0.11 valid=10s ipv6=off;
# One anonymous GitHub lookup per five minutes, shared by all download visitors.
proxy_cache_path /var/cache/nginx/releases levels=1:2 keys_zone=releases:1m max_size=10m inactive=24h;
upstream control-plane {
  zone control_plane 64k;
  server control-plane:8090 resolve;
}
server {
  listen 80;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml;
  location ^~ /assets/ { root /usr/share/nginx/html; try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location ^~ /images/ { root /usr/share/nginx/html; try_files $uri =404; add_header Cache-Control "public, max-age=3600"; }
  location ^~ /fonts/ { root /usr/share/nginx/html; try_files $uri =404; add_header Cache-Control "public, max-age=604800"; }
  location ^~ /downloads/ { root /usr/share/nginx/html; try_files $uri =404; add_header Cache-Control "no-cache"; }
  location = /downloads/desktop-releases.json {
    limit_except GET { deny all; }
    set $release_host api.github.com;
    proxy_pass https://$release_host/repos/JRH89/ForgeLoop/releases?per_page=20;
    proxy_ssl_server_name on;
    proxy_ssl_name api.github.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host api.github.com;
    proxy_set_header User-Agent ForgeLoop-Downloads;
    proxy_set_header Accept application/vnd.github+json;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_cache releases;
    proxy_cache_key desktop-releases;
    proxy_cache_valid 200 5m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=60";
  }
  location /api/runner/ { client_max_body_size 12m; proxy_pass http://control-plane/api/runner/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  root /usr/share/nginx/html;
  location = /support { try_files /support.html =404; add_header Cache-Control "no-store"; add_header X-Robots-Tag "noindex" always; add_header Referrer-Policy "no-referrer" always; }
  # Keep support abuse limits tied to this proxy's peer, not client-supplied forwarding chains.
  location /api/support/ { client_max_body_size 32k; proxy_pass http://control-plane/api/support/; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_set_header X-Forwarded-For $remote_addr; }
  location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
  error_page 404 /404.html;
  location = /404.html { internal; add_header X-Robots-Tag "noindex" always; }
  location = /app-shell.html { internal; add_header X-Robots-Tag "noindex" always; }
  location ~ \.html$ { internal; }
  location ~ ^(.+)/$ { return 308 $1$is_args$args; }
  location / { try_files $uri $uri.html =404; add_header Cache-Control "no-cache"; }
  # Pairing must render before login so its URL-fragment challenge survives OAuth.
  # This is only the approval shell; the GraphQL mutation still requires an admin.
  location = /app/runner-connect {
    root /usr/share/nginx/html;
    try_files /app-shell.html =404;
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "no-store";
  }
  # Downloading a public installer does not require a ForgeLoop account.
  location = /app/runner-downloads {
    try_files /app-shell.html =404;
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "no-store";
  }
  location ^~ /app {
    auth_request /_auth;
    error_page 401 403 =302 /oauth2/authorization/github;
    root /usr/share/nginx/html;
    try_files /app-shell.html =404;
    add_header X-Robots-Tag "noindex" always;
  }
  location = /_auth {
    internal;
    proxy_pass http://control-plane/api/auth/session;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
  location /graphql { proxy_pass http://control-plane/graphql; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_set_header Content-Type $content_type; }
  location /api/github/ { proxy_pass http://control-plane/api/github/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  location /oauth2/ { proxy_pass http://control-plane/oauth2/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  location /login/ { proxy_pass http://control-plane/login/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  location = /logout { proxy_pass http://control-plane/logout; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
}
