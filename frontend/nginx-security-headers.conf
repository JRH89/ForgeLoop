# Browser hardening for every response that nginx serves itself. Included in each static location
# because a location-level add_header discards inherited ones. Proxied control-plane routes are
# excluded on purpose: Spring Security writes the equivalent headers there, and duplicates such as
# "X-Frame-Options: DENY, DENY" are treated as invalid by some browsers.
add_header X-Content-Type-Options "nosniff" always;
# Clickjacking defence, notably for /app/runner-connect where an administrator approves a runner.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self' https://github.com" always;
add_header Referrer-Policy $forgeloop_referrer_policy always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Browsers ignore HSTS on plain-HTTP loopback checks; subdomains are deliberately not included.
add_header Strict-Transport-Security "max-age=31536000" always;
